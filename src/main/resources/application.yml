spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
contextiq:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  invitations:
    ttl-days: ${INVITATION_TTL_DAYS:7}
  rag:
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
    min-score: ${RAG_MIN_SCORE:0.45}
  ai:
    mode: ${AI_MODE:OLLAMA}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma4:e2b}
    max-output-tokens: ${OLLAMA_MAX_OUTPUT_TOKENS:1200}
    context-size: ${OLLAMA_CONTEXT_SIZE:16384}
  auth:
    google-enabled: ${GOOGLE_LOGIN_ENABLED:false}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
